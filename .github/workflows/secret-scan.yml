name: Secret Scan (gitleaks)

# Escaneo de secretos en la nube. Es la red de seguridad del equipo:
# se ejecuta en CADA push y CADA pull request, da igual el sistema o el
# antivirus de quien suba el código. Complementa al gitleaks local (pre-commit),
# que cada persona puede o no tener activo.
#
# Coste: repositorio privado -> usa minutos gratuitos de GitHub Actions
# (2.000/mes en plan Free). Un escaneo tarda ~20-60s, así que el consumo es mínimo.
#
# NOTA: usamos el binario gitleaks directamente (no la action gitleaks-action)
# porque esta última, en el primer push de un repo, intenta escanear el rango
# "<commit-raiz>^..HEAD" y falla con "unknown revision" (el commit raíz no tiene
# padre). Escanear el historial completo con el binario es más robusto.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: read

jobs:
  gitleaks:
    name: Escanear secretos con gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código (historial completo)
        uses: actions/checkout@v6  # ultima estable verificada 2026-06-16
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1   # [COMPLETAR-INFO: alinear con la version del equipo; ver https://github.com/gitleaks/gitleaks/releases]
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Escanear todo el historial en busca de secretos
        run: gitleaks git . --redact --verbose --exit-code 1
