# Just Enjoy — Docker Compose
#
# Servicios incluidos:
#   n8n     — orquestador del planificador de viajes (puerto 5678)
#
# USO:
#   Arrancar:      docker compose up -d
#   Ver logs n8n:  docker compose logs -f n8n
#   Parar:         docker compose down
#   Parar+borrar:  docker compose down -v   ← CUIDADO: borra datos de sesión

services:
  # ── n8n — Motor orquestador ──────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # URL base pública (ajusta con tu dominio o URL de ngrok)
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${NGROK_URL:-http://localhost:5678}
      # Timezone
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
      # Modo: production o development
      - NODE_ENV=production
      # Permite que los community nodes (SerpAPI, Tavily) se usen como tools
      # del AI Agent. Sin esto, n8n NO genera las variantes *Tool y el workflow
      # del planificador muestra esos nodos como "unrecognized node type".
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
      # Gestion declarativa de community nodes desde el entorno (n8n >= 2.21).
      # En cada arranque n8n reconcilia contra N8N_COMMUNITY_PACKAGES: instala
      # los que falten y DESINSTALA los que no esten en la lista (la lista es la
      # unica fuente de verdad; la UI de community nodes queda en solo lectura).
      # Asi el repo es reproducible: al clonar y "docker compose up" se instalan
      # solos los nodos que el workflow necesita.
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_COMMUNITY_PACKAGES_MANAGED_BY_ENV=true
      - N8N_COMMUNITY_PACKAGES=[{"name":"n8n-nodes-serpapi"},{"name":"@tavily/n8n-nodes-tavily"}]
      # Permite resolver expresiones {{ $env.X }} en credenciales/nodos.
      # En n8n v2.x el default es "true" (bloqueado); hay que ponerlo en false
      # para que las credenciales lean las API keys desde variables de entorno.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # API keys inyectadas desde el .env del host (NUNCA versionadas). Las
      # credenciales de n8n las leen como {{ $env.X }} (ver n8n/credentials/).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      n8n-import:
        condition: service_completed_successfully
    volumes:
      # Reutiliza el volumen existente del usuario (preserva cuenta y credenciales)
      - n8n_n8n_data:/home/node/.n8n
    networks:
      - just_enjoy_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── n8n-import — importa credenciales Y workflow al arrancar (efímero) ────
  # Corre ANTES que n8n (depends_on). Deja el stack REPRODUCIBLE en un equipo
  # nuevo: importa la estructura de credenciales (sin secretos; las claves salen
  # de las variables de entorno del .env de cada dev), importa el workflow
  # activo (v27) y lo marca como activo para que n8n registre el webhook al
  # arrancar. Termina; n8n solo arranca si este servicio finaliza con exito.
  n8n-import:
    image: n8nio/n8n:latest
    user: node
    entrypoint: ["/bin/sh", "-c"]
    command:
      # publish:workflow activa el workflow (registra el webhook). El id es el del
      # JSON de v27 (import preserva el id). --all/update:workflow --active están
      # deprecados en n8n 2.x.
      - "n8n import:credentials --input=/import/credentials.json && n8n import:workflow --input='/import-workflows/Planificador de Viajes v27.json' && n8n publish:workflow --id=1Yg0c5jJRlLjKfvm"
    volumes:
      # Mismo volumen que n8n: escribe en la misma BD cifrada
      - n8n_n8n_data:/home/node/.n8n
      # Monta el JSON de credenciales versionado (solo lectura)
      - ./n8n/credentials:/import:ro
      # Monta los workflows versionados (solo lectura) para importar el v27
      - ./n8n/workflows:/import-workflows:ro
    networks:
      - just_enjoy_net

volumes:
  # Volumen gestionado por compose: se crea vacío en cada equipo nuevo y el
  # servicio n8n-import lo rellena (credenciales + workflow v27). Reproducible.
  # (Antes era external: reutilizaba el volumen de un equipo concreto.)
  n8n_n8n_data:

networks:
  just_enjoy_net:
    driver: bridge
